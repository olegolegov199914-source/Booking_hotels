version: '5.4'
services:
  db:
    image: postgres:18
    container_name: booking_db
    env_file:
      - .env-non-dev 
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
      
  redis:
    image: redis:7
    container_name: booking_redis

  booking:                     
    image: booking_image
    build:
      context: .
    container_name: booking_app
    env_file:
      - .env-non-dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "
        alembic upgrade head &&
        exec gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
      "
    # ports:
    #   - 7777:8000

  celery:
    image: booking_celery
    build:
      context: .
    container_name: booking_celery
    command: sh -c "celery --app=app.tasks.celery_app:celery worker -l INFO"
    env_file:
      - .env-non-dev
    depends_on:
      - redis

  flower:
    image: booking_flower
    build:
      context: .
    container_name: booking_flower
    command: sh -c "celery --app=app.tasks.celery_app:celery flower"
    env_file:
      - .env-non-dev
    depends_on:
      - redis
    # ports:
    #   - 5555:5555


  # prometheus:
